# Synthea settings used for every batch in this project.
# Only CSV output is needed. FHIR bundles would add a lot of disk for nothing.
exporter.fhir.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.metadata.export = true
exporter.csv.export = true

# Claims tables are huge and not used by the rules.
exporter.csv.excluded_files = patient_expenses.csv, claims.csv, claims_transactions.csv, payer_transitions.csv

# Default is 10 years of history. Kept it so lookback windows have room.
exporter.years_of_history = 10

# The cohort is people alive on the index date, so dead patients are not exported.
generate.only_alive_patients = true
generate.log_patients.detail = none
